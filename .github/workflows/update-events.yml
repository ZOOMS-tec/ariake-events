name: イベント情報の自動更新

on:
  workflow_dispatch:
  # スクレイパーを実装して動作確認できるまでは、自動実行を有効にしない。
  # 有効にするときは、下の3行の先頭の「# 」を外す（日本時間9:17。GitHubのtimezone指定を使用）。
   schedule:
     - cron: "17 9 * * *"
       timezone: "Asia/Tokyo"

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: テスト
        run: python -m pytest -q
      - name: イベント取得（失敗時はevents.jsonを更新しない）
        run: python -m scripts.main
      - name: 変更があればコミット
        run: |
          if git diff --quiet -- events.json; then
            echo "events.json に変更なし"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add events.json
            git commit -m "chore: update event data $(TZ=Asia/Tokyo date +%F)"
            git push
          fi
