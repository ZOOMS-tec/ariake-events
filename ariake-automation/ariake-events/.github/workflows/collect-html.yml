name: HTML収集（調査用・手動実行）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scripts.collect_html
      - uses: actions/upload-artifact@v4
        with:
          name: html_samples
          path: html_samples/
          retention-days: 7
