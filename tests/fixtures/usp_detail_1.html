<!DOCTYPE html><html><head><title>【Wellness Park Tokyo】今話題の ”HYROX” 体験会イベント 開催決定！！  ｜イベント｜livedoor URBAN SPORTS PARK｜有明アーバンスポーツパーク</title></head><body><script data-nuxt-data="nuxt-app" data-ssr="true" id="__NUXT_DATA__" type="application/json">[["ShallowReactive",1],{"data":2,"state":25,"once":27,"_errors":28,"serverRendered":30,"path":31,"pinia":32},["ShallowReactive",3],{"dynamicDataevent\u002F20UR6uiX":4},{"slug":5,"cover":6,"title":7,"RnLwPWkO":8,"body":9,"_meta":10,"_filter":23,"id":24},"20UR6uiX","https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-design-asset-files\u002Fprojects\u002Fv7qGk2D9qL\u002Fs-1536x1024_v-fms_webp_c4981a50-1868-4bae-a844-201fd8060764.png","【Wellness Park Tokyo】今話題の ”HYROX” 体験会イベント 開催決定！！","2026年10月15日(木)～23日(金)","\u003Cp data-uid=\"z1D1MvQd\" data-time=\"1789116768488\">昨今話題沸騰中のスポーツイベント\u003Cstrong>HYROX\u003C\u002Fstrong>体験イベントの開催が決定しました！\u003C\u002Fp>\u003Cp data-uid=\"27_e6_fp\" data-time=\"1789115809071\">都心の真ん中、緑に囲まれた空間で、新しいスポーツとの出会い。\u003Cbr>ランニング × ファンクショナルトレーニングを掛け合わせた HYROX を、\u003Cbr>Brilliaランニングスタジアム（有明）の特設会場で体験できます。\u003C\u002Fp>\u003Cp data-uid=\"FjhMm8f2\" data-time=\"1789116064360\">申込HP→\u003Ca href=\"https:\u002F\u002Fpeatix.com\u002Fevent\u002F5170772\" data-has-link=\"true\">Wellness Park Tokyo ─ HYROX\u003C\u002Fa>\u003C\u002Fp>\u003Cp data-uid=\"hbO9HB4x\" data-time=\"1789115989395\">\u003Cstrong>■ 内容\u003C\u002Fstrong>\u003Cbr>・全8種目のワークアウトをランニングスタジアム内に設置、各種目の間に約1kmのランニングを実施（実力に併せて調整可能）\u003Cbr>・初心者から経験者まで幅広く参加可能\u003C\u002Fp>\u003Cp data-uid=\"qafYywyc\" data-time=\"1789115892724\">\u003Cstrong>■ 開催期間\u003C\u002Fstrong>\u003Cbr>2026年10月15日（木）〜 10月23日（金）\u003C\u002Fp>\u003Cp data-uid=\"4AuDzDvK\" data-time=\"1789115995784\">\u003Cstrong>■ 実施スケジュール\u003C\u002Fstrong>\u003Cbr>【平日】7:30〜9:00 ／ 19:00〜20:30\u003Cbr>【土日】8:00〜9:30 ／ 10:00〜11:30 ／ 12:00〜13:30 ／ 14:00〜15:30 ／ 16:00〜17:30\u003C\u002Fp>\u003Cp data-uid=\"UkZcPRLo\" data-time=\"1789116005561\">※10月17日（土）の10:00〜11:30の枠は実施しません\u003Cbr>※10月17日（土）8:00〜9:30 と 10月20日（火）7:30〜9:00 の回は mode protein smoothie付きです！\u003Cbr>※1枠あたり最大16組（32名）が参加可能\u003C\u002Fp>\u003Cp data-uid=\"Yb3ROIhc\" data-time=\"1789116022252\">\u003Cstrong>■ 参加料（Peatixにおける事前決済）\u003C\u002Fstrong>\u003Cbr>シングル：¥6,600（1名様分）\u003Cbr>ダブルス：¥11,000（2名様分）\u003Cbr>※申し込み画面での数量は「組」数です。\u003Cbr>※ダブルスはご本人が数量1でお申込みください。\u003C\u002Fp>\u003Cp data-uid=\"nG9Kofx5\" data-time=\"1789115809071\">※本イベントは予約制です。Peatixでの申込は参加予約となります。\u003Cbr>※参加費はPeatixによる事前決済となります。\u003C\u002Fp>\u003Cp data-uid=\"cL2UnsiN\" data-time=\"1789115899475\">\u003Cstrong>■ 主催\u003C\u002Fstrong>\u003Cbr>Tokyo Sports Wellness Village 株式会社\u003C\u002Fp>\u003Cp data-uid=\"bVVj9UfI\" data-time=\"1789115900613\">\u003Cstrong>■ 会場\u003C\u002Fstrong>\u003Cbr>livedoor URBAN SPORTS PARK（Brilliaランニングスタジアム）\u003Cbr>東京都江東区有明1丁目13-7\u003C\u002Fp>\u003Cp data-uid=\"9irBlgIk\" data-time=\"1789115906378\">\u003Cstrong>■ ご注意\u003C\u002Fstrong>\u003Cbr>・屋内施設のため雨天においても開催予定、荒天の場合は中止\u003Cbr>　または内容変更の場合があります。（前日17:00に最終判断）\u003Cbr>・当日キャンセルは50%返金\u003Cbr>・各クラスの最少催行組数は3組です。お申し込みが3組に満たない場合、\u003Cbr>　そのクラスは中止となる場合があります。\u003Cbr>・動きやすい服装・屋外用シューズでお越しください\u003Cbr>・当日の受付は開始時間の15分前から\u003C\u002Fp>\u003Cp data-uid=\"Vjev3nOy\" data-time=\"1789115906378\">・当日遅刻に関する問い合わせは、特段のご連絡は不要となります。定刻になりましたらクラスは開始します旨、ご了承ください。\u003C\u002Fp>",{"project":11,"publishedAt":13,"createdAt":14,"order":15,"publishType":16,"schema":17,"uid":21,"updatedAt":22},{"id":12},"KkoXWFwkceHVlP5xl7wL",["Date","2026-09-11T08:53:21.000Z"],["Date","2026-09-11T08:32:53.000Z"],-1,"draft",{"id":18,"key":19,"postType":20},"CPpZQX0Plz9pj71u5PeD","VIueYVdh","post","i67McEGa",["Date","2026-09-11T08:52:53.000Z"],[],"Un2QQiKhZASGoQSC1jxV",["Reactive",26],{},["Set"],["ShallowReactive",29],{"dynamicDataevent\u002F20UR6uiX":-1},true,"\u002Fevent\u002F20UR6uiX",["Reactive",33],{"cmsContentStore":34,"projectStore":38,"productStore":61,"pageHeadStore":404,"cmsStore":408,"useSnackBarStore":416},{"listContentsMap":35,"contentMap":36},["Map"],["Map",37,4],"VIueYVdh\u002F20UR6uiX",{"siteHos
