height=\"\">\u003Cfigcaption>\u003C\u002Ffigcaption>\u003C\u002Ffigure>\u003Cp data-uid=\"Cx7jAitn\" data-time=\"1789642536418\">10月11日(日)は10:00からオープニングショーを開催！“肉体派舞踏集団”として、昨シーズンD.LEAGUE王者に輝いたFULLCAST RAISERZも登場し、ステージパフォーマンスのほか来場者の皆さまと一緒に踊れるコンテンツや為末大氏のトークショー等も実施予定！また、その他、イベント期間中は演奏会やブレイキンなど、多彩なパフォーマンスをお届けします。※FULLCAST RAISERZの当日出演メンバーは後日発表します。\u003C\u002Fp>\u003Ch2 data-uid=\"CoyGR8mS\" data-time=\"1791371326354\" id=\"index_CoyGR8mS\">【追加出演決定】オープニングステージにゆうさくスポーツさんが登場！\u003C\u002Fh2>\u003Cfigure data-uid=\"oPSxhfm0\" data-time=\"1791373106091\" data-thread=\"\" style=\"\">\u003Cimg src=\"https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-design-asset-files\u002Fprojects\u002Fv7qGk2D9qL\u002Fs-1280x1280_v-fms_webp_079861ae-7002-440c-8f50-80284ade17f2.jpg\" alt=\"\" width=\"406\" height=\"\">\u003Cfigcaption>\u003C\u002Ffigcaption>\u003C\u002Ffigure>\u003Cp data-uid=\"lZ_0ekgT\" data-time=\"1791373166856\">10月11日（日）10:00からのオープニングステージに、スポーツ系インフルエンサーの「ゆうさくスポーツ」こと櫻井勇作さんの出演が決定！\u003Cbr>ゆうさくスポーツさんは、空手で日本一・世界一を経験し、現在はSNS総フォロワー数約140万人のスポーツ系インフルエンサーとして活躍しています。\u003Cbr>当日は、ここでしか見られないスペシャルステージをお届けします。\u003Cbr>スポーツ好きの方はもちろん、ゆうさくスポーツさんのファンの方も、ぜひ会場で一緒に2周年を盛り上げましょう！\u003C\u002Fp>\u003Cp data-uid=\"oYBsrwa1\" data-time=\"1791373901572\">ゆうさくスポーツ（櫻井勇作さん）Instagram：\u003Ca target=\"_blank\" href=\"https:\u002F\u002Fwww.instagram.com\u002Fyusaku02sports\u002F\" data-has-link=\"true\" rel=\"noopener\">@yusaku02sports\u003C\u002Fa>\u003C\u002Fp>\u003Cp data-uid=\"Rrp89xbF\" data-time=\"1791371377922\">\u003C\u002Fp>\u003Ch3 data-uid=\"91azoPTv\" data-time=\"1789647175952\" id=\"index_91azoPTv\">■「livedoor URBAN SPORTS PARK 2nd Anniv. Fes」開催概要\u003C\u002Fh3>\u003Cp data-uid=\"uUviwXBE\" data-time=\"1789642536418\">名　　称：livedoor URBAN SPORTS PARK 2nd Anniv. Fes\u003C\u002Fp>\u003Cp data-uid=\"2eWkRSAL\" data-time=\"1789642536418\">（ライブドア アーバンスポーツパーク セカンドアニバーサリーフェス）\u003C\u002Fp>\u003Cp data-uid=\"sT8Z7yR6\" data-time=\"1789642536418\">開催日時：10月11日(日)・12日(月・祝) 各日10:00～21:00（開場 8:00）\u003C\u002Fp>\u003Cp data-uid=\"Vb9G2pX0\" data-time=\"1789642536418\">会　　場：livedoor URBAN SPORTS PARK\u003C\u002Fp>\u003Cp data-uid=\"KUuwWIDp\" data-time=\"1789642536418\">〒135-0063　東京都江東区有明1丁目13-7 \u003Ca target=\"_blank\" href=\"https:\u002F\u002Fariake-usp.com\u002F\" data-has-link=\"true\" rel=\"\">https:\u002F\u002Fariake-usp.com\u002F\u003C\u002Fa>\u003C\u002Fp>\u003Cp data-uid=\"Ad0yq07u\" data-time=\"1789642536418\">アクセス：ゆりかもめ「有明テニスの森」駅 徒歩3分\u003C\u002Fp>\u003Cp data-uid=\"6oHRIGIv\" data-time=\"1789642536418\">りんかい線「国際展示場」駅 徒歩14分\u003C\u002Fp>\u003Cp data-uid=\"qpw_Kh5f\" data-time=\"1789642536418\">主　　催：Tokyo Sports Wellness Village株式会社\u003C\u002Fp>\u003Cp data-uid=\"6fzCphNW\" data-time=\"1791443261685\">後　　援：東京都\u003C\u002Fp>\u003Cp data-uid=\"gYmK1871\" data-time=\"1789642536418\">協　　賛：各社\u003C\u002Fp>\u003Cp data-uid=\"CTXza0kk\" data-time=\"1789642536418\">入場無料：一部有料プログラム有\u003C\u002Fp>\u003Cp data-uid=\"Yo3Vu02j\" data-time=\"1789642536418\">特設ページ：\u003Ca target=\"_blank\" href=\"https:\u002F\u002Fariake-usp.com\u002Fevent\u002FFC5mxb0u\" data-has-link=\"true\" rel=\"\">https:\u002F\u002Fariake-usp.com\u002Fevent\u002FFC5mxb0u\u003C\u002Fa>\u003C\u002Fp>\u003Cp data-uid=\"kUpkD5d_\" data-time=\"1789642536418\">※イベントパス（無料参加チケットおよび有料チケット）は後日、公式インスタグラム（\u003Ca target=\"_blank\" href=\"https:\u002F\u002Fwww.instagram.com\u002Flivedoor_urban_sports_park\u002F）にて告知いたします。\" data-has-link=\"true\" rel=\"\">https:\u002F\u002Fwww.instagram.com\u002Flivedoor_urban_sports_park\u002F）にて告知いたします。\u003C\u002Fa>\u003C\u002Fp>\u003Cp data-uid=\"elCfCsWq\" data-time=\"1789642536419\">※雨天時等、プログラムのスケジュールや実施場所が変更になることがあります。\u003C\u002Fp>\u003Cp data-uid=\"sycnNr53\" data-time=\"1789642536419\">【livedoor URBAN SPORTS PARKとは】\u003C\u002Fp>\u003Cfigure data-uid=\"rREMZQd5\" data-time=\"1789643940644\" data-thread=\"\" style=\"\">\u003Cimg src=\"https:\u002F\u002Fstorage.googleapis.com\u002Fstudio-design-asset-files\u002Fprojects\u002Fv7qGk2D9qL\u002Fs-850x454_v-fs_webp_8cced44a-57bb-40ad-b947-adb9b61b0f9f.png\" alt=\"\" width=\"\" height=\"\">\u003Cfigcaption>\u003C\u002Ffigcaption>\u003C\u002Ffigure>\u003Cp data-uid=\"GJDNwjfB\" data-time=\"1789642536419\">本施設は東京建物株式会社を代表企業とし、TSP太陽株式会社、株式会社日テレアックスオンで構成するコンソーシアムが設立したTokyo Sports Wellness Village株式会社が運営しています。\u003C\u002Fp>\u003Cp data-uid=\"K1UFMS5L\" data-time=\"1789642536419\">敷地面積約 3.1ha の規模を誇り、スケートボードパークや屋内ボルダリング棟、3×3 バスケットボールコートといったアーバンスポーツ施設に加え、屋外アスレチックやランニングスタジアムなどの運動施設、カフェやレストランなどの飲食施設を整備した複合型施設です。「跡地を、みんなで遊べる聖地へ」を合言葉としたlivedoor URBAN SPORTS PARKを運営しています。\u003C\u002Fp>\u003Cp data-uid=\"7nXLA6su\" data-time=\"1789642536419\">●livedoor URBAN SPORTS PARKにおけるTSP太陽の取り組みはこちら\u003C\u002Fp>\u003Cp data-uid=\"_2xN7E2V\" data-time=\"1789642536419\">\u003Ca target=\"_blank\" href=\"https:\u002F\u002Fwww.tsp-taiyo.co.jp\u002Fcolumn\u002Fp4505\u002F\" data-has-link=\"true\" rel=\"\">https:\u002F\u002Fwww.tsp-taiyo.co.jp\u002Fcolumn\u002Fp4505\u002F\u003C\u002Fa>\u003C\u002Fp>\u003Cp data-uid=\"u97f7J47\" data-time=\"1789642536419\">【TSP太陽 会社概要】\u003C\u002Fp>\u003Cp data-uid=\"OdUVNHDJ\" data-time=\"1789642536419\">社名 TSP太陽株式会社\u003C\u002Fp>\u003Cp data-uid=\"qCY51DQS\" data-time=\"1789642536419\">本社 東京都目黒区\u003C\u002Fp>\u003Cp data-uid=\"ZtfWZrqt\" data-time=\"1789642536419\">代表者 池澤嘉悟\u003C\u002Fp>\u003Cp data-uid=\"2dBz6NGp\" data-time=\"1789642536419\">従業員数 308名（2026年6月末時点）\u003C\u002Fp>\u003Cp data-uid=\"rikYsj__\" data-time=\"1789642536419\">事業内容 各種イベントの企画制作、会場の設計施工、運営管理、関連設備のレンタル他\u003C\u002Fp>\u003Cp data-uid=\"CkBnB88l\" data-time=\"1789642536419\">HP \u003Ca target=\"_blank\" href=\"https:\u002F\u002Fwww.tsp-taiyo.co.jp\" data-has-link=\"true\" rel=\"\">https:\u002F\u002Fwww.tsp-taiyo.co.jp\u003C\u002Fa>\u003C\u002Fp>\u003Cp data-uid=\"fq17lPJI\" data-time=\"1789642536419\">公式SNS Instagram : \u003Ca target=\"_blank\" href=\"https:\u002F\u002Fwww.instagram.com\u002Ftsptaiyo_pr\u002F\" data-has-link=\"true\" rel=\"\">https:\u002F\u002Fwww.instagram.com\u002Ftsptaiyo_pr\u002F\u003C\u002Fa>\u003C\u002Fp>\u003Cp data-uid=\"rEMOlnq0\" data-time=\"1789642536419\">X（旧Twitter） : \u003Ca target=\"_blank\" href=\"https:\u002F\u002Fx.com\u002FTSPtaiyo_pr\" data-has-link=\"true\" rel=\"\">https:\u002F\u002Fx.com\u002FTSPtaiyo_pr\u003C\u002Fa>\u003C\u002Fp>\u003Cp data-uid=\"XUcp7cGD\" data-time=\"1789642536419\">2025年に設立70周年を迎えたTSP太陽株式会社は、時代の変化や生活者ニーズを捉えた先進的な発想と空間プロデュースで、新たな感動体験を創造するイベントコンサルティング企業です。大阪・関西万博をはじめとする国際イベントから企業・地域のプロジェクトまで、事業計画、企画、クリエイティブ制作、建築設計・施工、運営、ホスピタリティサービスまでを一気通貫で提供しています。豊富な経験から培った独自のノウハウと最新の知見を掛け合わせ、企業価値・社会価値の向上につながる体験を設計。地域活性化や持続可能な社会の実現に貢献しています。これからも社会や市場の変化を先取りし、人々の心を動かし、記憶に残る新たな体験価値と感動を創出し続けます。\u003C\u002Fp>\u003Cp data-uid=\"ZuXmz24u\" data-time=\"1789642536419\">\u003C\u002Fp>",{"project":13,"publishedAt":15,"createdAt":16,"order":17,"publishType":18,"schema":19,"uid":23,"updatedAt":24},{"id":14},"KkoXWFwkceHVlP5xl7wL",["Date","2026-09-18T05:00:00.000Z"],["Date","2026-09-14T01:00:29.000Z"],-1,"change",{"id":20,"key":21,"postType":22},"CPpZQX0Plz9pj71u5PeD","VIueYVdh","post","zi3UpeoI",["Date","2026-10-08T07:07:46.000Z"],[],"SdlBCqZBH2KUxUB7Hgou",["Reactive",28],{},["Set"],["ShallowReactive",31],{"dynamicDataevent\u002FFC5mxb0u":-1},"\u002Fevent\u002FFC5mxb0u",["Reactive",34],{"cmsContentStore":35,"projectStore":39,"productStore":61,"pageHeadStore":404,"cmsStore":408,"useSnackBarStore":416},{"listContentsMap":36,"contentMap":37},["Map"],["Map",38,4],"VIueYVdh\u002FFC5mxb0u",{"siteHost":40,"customProxyDomain":9,"project":41},"ariake-usp.com",{"id":42,"name":43,"customDomain":9,"iconImage":9,"coverImage":44,"displayBadge":45,"integrations":46,"snapshot_path":59,"snapshot_id":60,"recaptchaSiteKey":-1,"conversionEvents":-1},"v7qGk2D9qL","livedoor URBAN SPORTS PARK","https:\u002F\u002Fstorage.googleapis.com\u002Fproduction-os-assets\u002Fassets\u002Fcc4dc10d-cb29-4bba-8b94-25e019a6a54d",false,[47,50,53,56],{"integration_name":48,"code":49},"custom-code","true",{"integration_name":51,"code":52},"google-analytics","G-TCCP6QG6GC",{"integration_
