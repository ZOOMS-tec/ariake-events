<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARIake EVENT CALENDAR｜有明エリアのイベント情報</title>
<meta name="description" content="東京ビッグサイト・東京ガーデンシアター・有明アリーナ・有明ガーデンのイベント情報をまとめて確認">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="hd">
 <div class="wrap hd-in">
  <div><h1>ARIake EVENT CALENDAR</h1><p class="sub">有明エリアのイベント情報をひと目で確認</p></div>
  <div class="now"><div id="date" class="date">--</div><div id="clock" class="clock">--:--</div><div class="upd">データ更新：<span id="updated">--</span></div></div>
 </div>
</header>
<main class="wrap">
 <section class="ctl" aria-label="絞り込み">
  <div id="facs" class="row" role="group" aria-label="施設"></div>
  <div id="pers" class="row seg" role="group" aria-label="期間"></div>
  <input id="q" type="search" placeholder="イベント名・施設・カテゴリで検索" aria-label="キーワード検索" autocomplete="off">
 </section>
 <p id="count" class="count" aria-live="polite"></p>
 <div id="list" class="list"></div>
 <div id="msg" class="msg" hidden></div>
</main>
<footer class="wrap ft">掲載情報は各施設の公式サイトをもとにしています。最新・詳細は必ず公式サイトでご確認ください。</footer>
<script src="js/app.js"></script>
</body>
</html>
